# Test-only overrides. Files in src/test/resources take priority over
# src/main/resources on the test classpath, and .properties beats .yml.

# A fixed key so tests don't need the JWT_SECRET environment variable.
# TEST ONLY: never use this value anywhere else.
app.security.jwt-secret=dGVzdC1vbmx5LWtleS1kby1ub3QtdXNlLWluLXByb2R1Y3Rpb24hIQ==
app.security.cookie-secure=true
app.security.cors-allowed-origins=http://localhost:5173

# Testcontainers' @ServiceConnection supplies the real URL/credentials; this
# only satisfies the ${DB_PASSWORD} placeholder in application.yml.
spring.datasource.password=supplied-by-testcontainers
